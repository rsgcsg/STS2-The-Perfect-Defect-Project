[project]
name = "sts2-connector-mcp"
version = "1.0.0rc1"
description = "Thin MCP transport for the STS2 Player Environment"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.7.1",
    "httpx>=0.25.0",
]

[project.scripts]
sts2-connector-mcp = "server:main"

[tool.uv]
# MCP supplies PyJWT[crypto]; exclude the affected GHSA-ffc3-869f-jxw9 releases.
constraint-dependencies = ["pyjwt>=2.14.0"]
