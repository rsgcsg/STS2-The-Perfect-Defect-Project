[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsgcsg-sts2-platform-evidence"
version = "0.1.0-rc.15"
description = "Typed, fail-closed evidence verification and transfer primitives."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sts2-evidence = "sts2_platform_evidence.cli:main"
sts2-evidence-delivery = "sts2_platform_evidence.delivery_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sts2_platform_evidence*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
sts2_platform_evidence = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
