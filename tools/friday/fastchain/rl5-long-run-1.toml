# First RL5 long run (lead 11-18; unified recipe 11-20): an overlay on rl5-fastchain.toml.
# Only the knobs that differ from it are listed; every other knob is the base profile's.
# `value` = this run, `default` = the base profile's value. Learner recipe keys that are not
# run-profile knobs (lr, head_lr, clip, target_kl, gae_lambda, c_hp and its scope,
# explore_ratio_floor, value_target, capacity_victim, batch geometry) are in the frozen recipe
# python/configs/rl5-long-run-1.json, which preflight A9 compares with the gate.
# Unified recipe (the 11-20 comparison's group A): arm_policy_update own, explore_ratio_floor 0,
# value_config_input on, the 6-cell ladder, save starts 0.5. explore_ratio_floor: the gate's
# learner-base.json keeps a loss key it has (the frozen JSON only fills missing ones), so a
# gate copy carrying 0.3 is refused by A9 (frozen_recipe), never run at 0.3: the long run's
# gate copy carries 0 or no floor key (python/docs/RL_LONG_RUN.zh-CN.md, site side).
# Not read by the fast chain (segment learner): loss.kl_coef / anchor_coef / rho_max (kept in
# the frozen JSON only because the V5-era gate carries them and A9 refuses gate loss keys the
# frozen JSON lacks) and the gate's max_staleness / max_reuse / max_episode_age_seconds.
# Start (site, not here): start_package = the a46afd12 package, warmup_file = 3cf87760
# (as the V6 smokes); a fresh chain from that package, not --resume-checkpoint.
# The short hardware check before it: rl5-long-run-1-hwcheck.toml (an overlay on this file).
schema = "spireagent/friday-fastchain-profile-1"
base = "rl5-fastchain.toml"

[knobs]
# --- learner recipe ---
frozen_learner_config = { value = "python/configs/rl5-long-run-1.json", default = "python/configs/rl5.json", why = "the long run's frozen recipe: rl5.json + c_hp 0.003 all_combats, value_target game, capacity_victim hash, kl_stop_scope control, the unified recipe (explore_ratio_floor 0, arm_policy_update own, value_config_input true) and the four LossConfig-default loss keys the V5-era gate carries (kl_coef, anchor_coef, rho_max: not read by the fast chain)", measured = "lead 11-18; unified recipe = the 11-20 comparison group A (its frozen copy had these keys, A9 PASS; hwcheck run 7 first ran own + value_config_input)" }
segment_format = { value = "stpd/rl-fast-segment-4", default = "stpd/rl-fast-segment-3", why = "c_hp 0.003 > 0 needs the per-combat HP score column (preflight hp_score)", measured = "V6 smokes 11-16/17 (format 4 ran)" }
hp_combat_weights = { value = { normal = 1.0, elite = 1.0, boss = 0.3 }, default = { normal = 1.0, elite = 1.0, boss = 1.0 }, why = "boss HP change weighted 0.3: a boss fight's HP loss matters less than surviving it (plan v3 §3.2 start value)", measured = "set by the lead in #616, confirmed by the user 2026-11-20 (the effect is not measured; V6 ran 1 / 1 / 1)" }
hp_potion_mode = { value = "value_head_neutral", default = "points", why = "potion use judged by the outcome advantage, and the HP score neutral on potions per combat (#608)", measured = "lead 11-18; unit tests only" }
kl_stop_scope = { value = "control", default = "all", why = "exploration arms deviate from theta on purpose; the KL stop measures the control arm's rows only (owner 11-16)", measured = "V6 smokes ran control scope; control KL itself not yet read over hours" }
value_config_input = { value = true, default = false, why = "unified recipe: the outcome and HP value heads read the game's sampling config, so V(s) is the cell's own value (#621)", measured = "11-20 comparison group A and hwcheck run 7 (hw7t)" }
arm_policy_update = { value = "own", default = "normal", why = "unified recipe: each cell's rows update its own cell policy, ratio 1 at unchanged weights (#622); refuses explore_ratio_floor > 0, so the frozen JSON carries 0", measured = "11-20 comparison: KL-stopped 0.6% of updates (26/4156) vs the old recipe 5.2% (220/4202)" }
# --- exploration (env-side recipe) ---
exploration_ladder = { value = { control = { share = 0.40, combat = { temperature = 1.0, uniform_mix = 0.0 }, noncombat = { temperature = 1.0, uniform_mix = 0.0 } }, cold = { share = 0.10, combat = { temperature = 0.5, uniform_mix = 0.0 }, noncombat = { temperature = 0.5, uniform_mix = 0.0 } }, cool = { share = 0.10, combat = { temperature = 0.7, uniform_mix = 0.0 }, noncombat = { temperature = 0.7, uniform_mix = 0.0 } }, nc16 = { share = 0.15, combat = { temperature = 1.0, uniform_mix = 0.0 }, noncombat = { temperature = 1.6, uniform_mix = 0.0 } }, nc25 = { share = 0.15, combat = { temperature = 1.0, uniform_mix = 0.0 }, noncombat = { temperature = 2.5, uniform_mix = 0.0 } }, both13 = { share = 0.10, combat = { temperature = 1.3, uniform_mix = 0.0 }, noncombat = { temperature = 1.3, uniform_mix = 0.0 } } }, default = { control = { share = 1.0, combat = { temperature = 1.0, uniform_mix = 0.0 }, noncombat = { temperature = 1.0, uniform_mix = 0.0 } } }, why = "the 6-cell ladder of the 11-20 comparison: control 0.40; cold T 0.5 0.10; cool T 0.7 0.10; noncombat T 1.6 0.15; noncombat T 2.5 0.15; both T 1.3 0.10; uniform mix 0 everywhere", measured = "11-20 comparison group A (60 drivers 24/6/6/9/9/6); whether the cells help is not measured" }
sampling_temperature_min = { value = 0.5, default = 1.0, why = "the lowest cell is cold T 0.5", measured = "11-20 comparison group A" }
save_starts = { value = { share = 0.5, random_saves = 2, act_weights = [1.0, 1.0, 1.0], died_later_weight = 0.0, uses_per_save = 16, pool_gb = 10.0 }, default = { share = 0.0, random_saves = 2, act_weights = [1.0, 1.0, 1.0], died_later_weight = 0.0, uses_per_save = 16, pool_gb = 10.0 }, why = "share 0.5 = each open tries a save start with probability 0.5 (user 11-19); other fields the base's", measured = "11-20 comparison group A: save loads failed 307 times, 3.7% of save-start attempts" }
# --- hardware: 2 cards 1i+1t, GPU job 16 + 16 cores (base), 8 prep hosts (base) ---
env_core_budget = { value = { "1" = 215, "2" = 256, "3" = 304 }, default = { "1" = 215, "2" = 290, "3" = 304 }, why = "2 cards: 256 env cores = 16 nodes of 16, written out (the base 290 is cut to 300 - 32 = 268 and then to an even node count, 256, by the plan)", measured = "lead 11-18; core cap 300" }
# --- resumes ---
resume_max_total = { value = 6, default = 3, why = "automatic resumes per chain: RL4.2 stopped 6 times in its first half; at 3 a 4th preemption at night ends the chain with no one to restart it; the run's total budget (26 / 52 card-hours, 36 h wall) still caps it", measured = "lead long-run plan (RL5 BOOK/07 section 1.2), user approved 11-20" }
# --- clock ---
train_target_seconds = { value = 72000, default = 0, why = "20 h of learner training, counted across resumes in the CP's operating budget; the chain ends normal when it is reached (#603)", measured = "user 11-18" }
long_wall_seconds = { value = 86400, default = 72000, why = "the chain's wall limit with a training target: generation 0 is refused when the wall left cannot hold the 72000 s target, and the wall left is already below 72000 a moment after the chain starts; 86400 leaves about 4 h for start-ups, resumes and queue (#603 knob note)", measured = "not measured (derived from the target)" }
# --- evaluation and readout ---
eval_seeds = { value = 300, default = 100, why = "every A0 round is the fixed 300-seed suite (start the chain with --eval-manifest of the A0 300 suite), three parallel jobs of eval_batch_seeds 100, paired per seed with the start model", measured = "a46afd12 on A0 300: mean 36.96 floors, 4 wins; paired-difference half-width about 1.4 floors at 300 (one past model pair)" }
eval_batch_seeds = { value = 100, default = 0, why = "evaluation jobs of 100 seeds: a 300-seed A0 round runs as three parallel jobs", measured = "lead 11-18; RL5-eval-baselines (A0 100 games 5,133 s on 16 cores)" }
eval_episode_seconds = { value = 3600, default = 1800, why = "per-game cap 3600 s: on the slow node class healthy games run about 5x longer than on the fast class (same seed, same decisions) and 1800 s cut 80 of 300 while still moving; a game still running at 3600 s is cut, reported unknown/censored, never retried", measured = "#614: slow class, 58 cut games with a fast twin need median 2066 s, max 2682 s; none cut at 3600" }
eval_wall_seconds = { value = 17000, default = 0, why = "job wall 17000 s: start window = wall - cap - 900 = 12500 s; the planned wall keeps the fast-node 9375 s window, too short for 100 slow-class games at a 3600 s cap; the job still ends when its games end", measured = "#614: 16-slot replay of the three slow-class 100-game batches: last game starts at up to 10231 s, play ends at up to 11978 s" }
readout_rolling_games = { value = [100, 1000], default = [100], why = "the 1000-game window carries the stall rule and the A0 30% rolling win rate; 100 stays the headline (#556)", measured = "lead 11-18" }
# --- retention (finite; arithmetic in python/docs/RL_LONG_RUN.zh-CN.md) ---
checkpoint_keep_newest = { value = 24, default = 0, why = "keep the newest 24 CPs (2 h at one per 300 s) plus every CP an evaluation claimed or pointed at, generation starts (cp_retention.py keeps those whatever N is); 20 h at 84.9 MB per CP is 20.4 GB kept whole, this about 4 GB", measured = "V5 smoke: 84.9 MB per CP; CP every 300 s" }
model_keep_newest = { value = 256, default = 0, why = "peer copies of mu publications: newest 256 plus the version of every kept CP; no live path reads an old one on the peer (inference serves from the learner-local store), 256 is about 2x the p95 inference lag of 131 versions", measured = "lag mean 68 / p95 131 versions (price run); ~2,100 publications per hour (V6 smoke: mu 276 at 7.8 min, inferred)" }
learner_local_keep_models = { value = 256, default = 0, why = "GPU-node copies of mu publications: newest 256 plus every snapshot get_mu may still serve and the newest local CP's version (local_retention.py protects those whatever K is); 256 is about 2x the p95 lag of 131 versions", measured = "~45 GB/h kept whole on the GPU node (#558, inferred); lag mean 68 / p95 131" }
learner_local_keep_checkpoints = { value = 4, default = 0, why = "GPU-node copies of CPs: newest 4 (resume reads the peer); an older one goes once the archive receipt shows the peer has it", measured = "V5 smoke: 84.9 MB per CP" }
