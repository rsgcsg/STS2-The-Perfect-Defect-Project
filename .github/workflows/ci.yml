name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * 0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.route.outputs.scope }}
      proof: ${{ steps.route.outputs.proof }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - id: route
        name: Select checks from actual Git changes
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECK_FULL: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        run: node tools/check-plan.mjs

  docs:
    needs: plan
    if: needs.plan.outputs.scope == 'docs' || needs.plan.outputs.scope == 'reuse'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Run selected repository checks
        env:
          CHECK_SCOPE: ${{ needs.plan.outputs.scope }}
        run: node tools/check-plan.mjs execute
      - name: Check committed editorial patch
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$CHECK_BASE" HEAD --

  linux-portability:
    needs: plan
    if: needs.plan.outputs.scope == 'full' || needs.plan.outputs.scope == 'python'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            python/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Install locked Python environment
        run: uv sync --project python --locked --all-extras
      - name: Install Python consumer SDK packages
        run: npm ci --prefix python
      - name: Install dependencies
        run: npm ci
      - name: Run selected portable source/test gate
        env:
          CHECK_SCOPE: ${{ needs.plan.outputs.scope }}
        run: node tools/check-plan.mjs execute
      - name: Retain Python test timings and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-${{ runner.os }}-${{ github.run_attempt }}
          path: python/.local/pytest.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Check patch hygiene
        run: git diff --check

  windows-portability:
    needs: plan
    if: needs.plan.outputs.scope == 'full' || needs.plan.outputs.scope == 'python'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            python/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Install locked Python environment
        run: uv sync --project python --locked --all-extras
      - name: Install Python consumer SDK packages
        run: npm ci --prefix python
      - name: Install dependencies
        run: npm ci
      - name: Run selected portable source/test gate
        env:
          CHECK_SCOPE: ${{ needs.plan.outputs.scope }}
        run: node tools/check-plan.mjs execute
      - name: Retain Python test timings and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-${{ runner.os }}-${{ github.run_attempt }}
          path: python/.local/pytest.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Check patch hygiene
        run: git diff --check

  portable:
    if: ${{ always() }}
    needs: [plan, docs, linux-portability, windows-portability]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Require every selected check; skipped is not a full PASS
        env:
          CHECK_SCOPE: ${{ needs.plan.outputs.scope }}
          CHECK_PROOF: ${{ needs.plan.outputs.proof }}
          PLAN_RESULT: ${{ needs.plan.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          LINUX_RESULT: ${{ needs.linux-portability.result }}
          WINDOWS_RESULT: ${{ needs.windows-portability.result }}
        run: node tools/check-plan.mjs aggregate
      - name: Retain fresh execution receipt
        if: needs.plan.outputs.scope == 'full' || needs.plan.outputs.scope == 'python'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-execution-receipt-${{ github.run_attempt }}
          path: .local/ci/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
